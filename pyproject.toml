[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luple-git"
version = "0.5.0"
description = "Local game-style save/load timelines on Git"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lu = "luple.cli:main"

[tool.setuptools.packages.find]
include = ["luple*"]

